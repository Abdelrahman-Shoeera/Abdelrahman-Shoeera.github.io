    <section class="about-layout">
  <div class="terminal-section">

  <script>
    // ============================================================
    // Config
    // ============================================================
    const API_BASE = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
      ? "http://127.0.0.1:8000"
      : "https://portfolio-terminal-api-cu2y.onrender.com";

    // ============================================================
    // DOM references
    // ============================================================
    const terminalBody = document.getElementById("terminal-body");
    const terminalInput = document.getElementById("terminal-input");
    const bootMessage = document.getElementById("boot-message");
    const terminal = document.getElementById("terminal");

    // ============================================================
    // Rendering helpers
    // ============================================================
    function appendLine(text, className) {
      const line = document.createElement("div");
      line.className = "terminal-line " + (className || "");
      line.textContent = text;
      terminalBody.appendChild(line);
    }

    function appendCommandEcho(command) {
      const line = document.createElement("div");
      line.className = "terminal-line echo";
      line.innerHTML = '<span class="terminal-prompt">abdelrahman@portfolio:~$</span> ' +
        escapeHtml(command);
      terminalBody.appendChild(line);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
    function scrollToBottom() {
       terminalBody.scrollTop = terminalBody.scrollHeight;
      }

    // ============================================================
    // Command execution
    // ============================================================
    async function runCommand(command) {
      const trimmed = command.trim();
      if (trimmed === "") return;

      appendCommandEcho(trimmed);

      // Client-side commands (no backend call)
      if (trimmed.toLowerCase() === "clear") {
        terminalBody.innerHTML = "";
        return;
      }

      try {
        const response = await fetch(API_BASE + "/cmd/" + encodeURIComponent(trimmed));
        const data = await response.json();

        if (response.ok) {
          appendLine(data.output, "output");
        } else {
          appendLine(data.detail || "error: unknown response", "error");
        }
      } catch (err) {
        appendLine("error: could not reach backend. is the server awake?", "error");
      }

      scrollToBottom();
    }

    // ============================================================
    // Input handling
    // ============================================================
    terminalInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        const command = terminalInput.value;
        terminalInput.value = "";
        runCommand(command);
      }
    });

    // Keep input focused when clicking anywhere in the terminal
    terminal.addEventListener("click", function () {
      terminalInput.focus();
    });

    // Focus input on page load
    terminalInput.focus();

    // ============================================================
    // Boot sequence — auto-run 'help' on load
    // ============================================================
   (async function boot() {
  // Only show the boot message if the fetch takes >300ms.
  // Fast responses never flash it.
  let seconds = 0;
  let counter = null;
  const revealDelay = setTimeout(() => {
    bootMessage.style.display = "block";
    bootMessage.textContent = "Booting portfolio... waking backend (usually 30–40s on first visit)...";
    counter = setInterval(() => {
      seconds++;
      bootMessage.textContent =
        "Booting portfolio... waking backend (" + seconds + "s, usually 30–40s on first visit)...";
    }, 1000);
  }, 300);

  try {
    const response = await fetch(API_BASE + "/cmd/help");
    const data = await response.json();
    clearTimeout(revealDelay);
    if (counter) clearInterval(counter);
    bootMessage.remove();
    appendCommandEcho("help");
    appendLine(data.output, "output");
    scrollToBottom();
  } catch (err) {
    clearTimeout(revealDelay);
    if (counter) clearInterval(counter);
    bootMessage.style.display = "block";
    bootMessage.textContent = "backend unreachable. try typing a command anyway.";
    bootMessage.className = "terminal-line error";
  }
})();

  </script>
